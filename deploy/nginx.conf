# ---------------------------------------------------------------------------
# Nginx front door for the Instant Mechanic API on EC2.
#
# Copy to /etc/nginx/sites-available/instant-mechanic, then:
#   sudo ln -s /etc/nginx/sites-available/instant-mechanic /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites this file to add the TLS block. Run it AFTER this works
# over plain http, or it has nothing to attach the certificate to.
# ---------------------------------------------------------------------------

server {
  listen 80;
  # Replace with the domain that points at this machine's public IP.
  server_name api.yourdomain.com;

  # Node writes its own; a second one is just noise.
  access_log /var/log/nginx/instant-mechanic.access.log;
  error_log  /var/log/nginx/instant-mechanic.error.log;

  location / {
    proxy_pass http://127.0.0.1:4000;

    # ---- The WebSocket handshake --------------------------------------
    # Without these three lines Socket.IO never upgrades. Nothing errors:
    # the dashboard silently falls back to polling and its indicator
    # changes from "Live" to "Polling". This is the step people miss.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ---- Who the client really is -------------------------------------
    # The API sets TRUST_PROXY=1 so its rate limiter reads this, not the
    # proxy's own address. Set one without the other and either every
    # request looks like one IP, or the limiter can be walked past.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Timeouts ------------------------------------------------------
    # An idle socket is normal here: Socket.IO pings every 10s, but a quiet
    # connection must survive far longer than the 60s default.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    # Server-sent data should reach the browser immediately, not in blocks.
    proxy_buffering off;
  }
}
